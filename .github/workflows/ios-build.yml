name: Veylo 0.0.1 iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile for iOS Simulator
        run: |
          xcodebuild -project Veylo.xcodeproj -scheme Veylo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project Veylo.xcodeproj -scheme Veylo -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/VeyloBuild" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for external signing
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/VeyloBuild/Build/Products/Release-iphoneos/Veylo.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Veylo-0.0.1-unsigned.ipa" Payload)
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Veylo-0.0.1-unsigned-IPA
          path: Veylo-unsigned.ipa
          retention-days: 7
