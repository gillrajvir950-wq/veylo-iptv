name: Veylo 0.0.30 iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Install VLC dependency
        run: |
          sudo gem install cocoapods --no-document
          pod install
      - name: Compile for iOS Simulator
        run: |
          xcodebuild -workspace Veylo.xcworkspace -scheme Veylo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -workspace Veylo.xcworkspace -scheme Veylo -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/VeyloBuild" CODE_SIGNING_ALLOWED=NO build
      - name: Verify HTTP ATS configuration
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/VeyloBuild/Build/Products/Release-iphoneos/Veylo.app"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$APP/Info.plist" | grep -qx true
      - name: Verify native fullscreen launch screen
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/VeyloBuild/Build/Products/Release-iphoneos/Veylo.app"
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$APP/Info.plist" | grep -qx LaunchScreen
          test -f "$APP/LaunchScreen.storyboardc/Info.plist"
      - name: Verify app icon
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/VeyloBuild/Build/Products/Release-iphoneos/Veylo.app"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist" | grep -qx AppIcon
      - name: Package unsigned IPA for external signing
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/VeyloBuild/Build/Products/Release-iphoneos/Veylo.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Veylo-0.0.30-unsigned.ipa" Payload)
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Veylo-0.0.30-unsigned-IPA
          path: Veylo-0.0.30-unsigned.ipa
          retention-days: 7
