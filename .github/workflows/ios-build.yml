name: Veylo 0.0.43 iOS Build

on:
  push:
    branches: [main]
    paths-ignore: ['TizenTV/**', '.github/workflows/tizen-build.yml', 'Android/**', '.github/workflows/android-build.yml', 'CLAUDE.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select newest Xcode (iOS 26 SDK for Liquid Glass)
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version
          xcrun swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Install VLC dependency
        run: |
          sudo gem install cocoapods --no-document
          pod install
      - name: Compile for iOS Simulator
        run: |
          set +e
          xcodebuild -workspace Veylo.xcworkspace -scheme Veylo -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/sim-build.log"
          STATUS=${PIPESTATUS[0]}
          grep -E "error:|error :" "$RUNNER_TEMP/sim-build.log" | sort -u | head -25 | while IFS= read -r line; do echo "::error title=Compile::${line}"; done
          exit $STATUS
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -workspace Veylo.xcworkspace -scheme Veylo -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/VeyloBuild" CODE_SIGNING_ALLOWED=NO build
      - name: Verify HTTP ATS configuration
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/VeyloBuild/Build/Products/Release-iphoneos/Veylo.app"
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$APP/Info.plist" | grep -qx true
      - name: Verify native fullscreen launch screen
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/VeyloBuild/Build/Products/Release-iphoneos/Veylo.app"
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$APP/Info.plist" | grep -qx LaunchScreen
          test -f "$APP/LaunchScreen.storyboardc/Info.plist"
      - name: Verify app icon
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/VeyloBuild/Build/Products/Release-iphoneos/Veylo.app"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist" | grep -qx AppIcon
      - name: Report SDK (Liquid Glass needs iphoneos26+)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/VeyloBuild/Build/Products/Release-iphoneos/Veylo.app"
          SDK=$(/usr/libexec/PlistBuddy -c "Print :DTSDKName" "$APP/Info.plist")
          XC=$(xcodebuild -version | tr '\n' ' ')
          echo "::notice title=Build SDK::$SDK — $XC"
      - name: Package unsigned IPA for external signing
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/VeyloBuild/Build/Products/Release-iphoneos/Veylo.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Veylo-0.0.43-unsigned.ipa" Payload)
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Veylo-0.0.43-unsigned-IPA
          path: Veylo-0.0.43-unsigned.ipa
          retention-days: 7
