name: Veylo
options:
  bundleIdPrefix: com.veylo
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  Veylo:
    type: application
    platform: iOS
    sources:
      - Apple/Veylo
    info:
      path: Apple/Veylo/Info.plist
      properties:
        CFBundleDisplayName: 'Veylo 0.0.3'
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.veylo.player
        MARKETING_VERSION: 0.0.3
        CURRENT_PROJECT_VERSION: 3
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGNING_ALLOWED: NO
